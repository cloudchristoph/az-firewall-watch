name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create/upload release assets

jobs:
  validate-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Ensure CHANGELOG has section for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## \[${version}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md is missing '## [${version}]' section"; exit 1; }

  build:
    needs: validate-changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: az-firewall-watch-linux
          - os: macos-latest # Apple Silicon / arm64
            artifact: az-firewall-watch-macos
          - os: windows-latest
            artifact: az-firewall-watch

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: Build binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --onefile \
            --name az-firewall-watch \
            --collect-all textual \
            --hidden-import azure.eventhub \
            --hidden-import azure.eventhub.aio \
            --hidden-import azure.eventhub._transport._pyamqp_transport \
            --add-data "fw_parser.py:." \
            --add-data "version.txt:." \
            main.py

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller `
            --onefile `
            --name az-firewall-watch `
            --collect-all textual `
            --hidden-import azure.eventhub `
            --hidden-import azure.eventhub.aio `
            "--hidden-import" "azure.eventhub._transport._pyamqp_transport" `
            "--add-data" "fw_parser.py;." `
            "--add-data" "version.txt;." `
            main.py

      - name: Package artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            : # dist/az-firewall-watch.exe is already the correct name
          else
            cd dist && tar -czf "${{ matrix.artifact }}.tar.gz" az-firewall-watch && rm az-firewall-watch
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Slice the section between "## [<version>]" and the next "## [" header.
          notes=$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "::warning::No CHANGELOG.md section found for version $version — falling back to auto-generated notes."
            notes="_No manual release notes provided._"
          fi
          {
            echo "notes<<EOF"
            echo "$notes"
            echo ""
            echo "## Download"
            echo ""
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| Linux (x86_64) | \`az-firewall-watch-linux.tar.gz\` |"
            echo "| macOS Apple Silicon | \`az-firewall-watch-macos.tar.gz\` |"
            echo "| Windows | \`az-firewall-watch.exe\` |"
            echo ""
            echo "See the [Getting started](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md#-getting-started) section of the README for first-run instructions on each platform."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.notes }}
