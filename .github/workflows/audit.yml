name: Dependency audit

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 07:00 CET (08:00 CEST in summer), catches advisories published since the last release
  pull_request:
    paths:
      - "requirements*.txt"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      # -r resolves the declared files (transitive packages included) in an isolated env,
      # so pip-audit and bootstrap packages of this runner are not part of the audit
      - name: pip-audit
        run: pip-audit -r requirements.txt -r requirements-build.txt
