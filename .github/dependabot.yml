version: 2

updates:
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      # upload-artifact and download-artifact must stay compatible and only run
      # in release.yml, so every update of the pair (majors too) comes as one PR
      # that is checked with a dry run. First match wins, so this group comes first.
      artifact-actions:
        applies-to: version-updates
        patterns: ["actions/upload-artifact", "actions/download-artifact"]
      actions-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]

  # The uv ecosystem regenerates the requirements-*.lock.txt files from their .lock.in
  # sources with uv pip compile, keeping --universal and --generate-hashes
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
