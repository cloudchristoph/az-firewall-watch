name: Release binaries

on:
  push:
    tags:
      - "v*"
    # Dry run: a push to dryrun/<anything> builds every binary and renders the cask
    # and winget manifests as workflow artifacts, without a release or a tap push.
    branches:
      - "dryrun/**"

# Read-only by default: dryrun/** branches run this workflow too. The release
# job grants itself contents: write; the tap push uses its own token.
permissions:
  contents: read

jobs:
  validate-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false   # no token left in .git/config for later steps
      - name: Ensure CHANGELOG has section for this tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## \[${version}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md is missing '## [${version}]' section"; exit 1; }
          [ "$(tr -d '[:space:]' < version.txt)" = "$version" ] \
            || { echo "::error::version.txt reads '$(cat version.txt)', the tag says '${version}'"; exit 1; }

  build:
    needs: validate-changelog
    permissions:
      contents: read
      actions: read   # SignPath reads the uploaded artifact through GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned: a PyInstaller binary needs at least the build host's glibc,
          # so ubuntu-latest moving to a newer release would drop older distros.
          - os: ubuntu-24.04
            artifact: az-firewall-watch-linux
          - os: ubuntu-24.04-arm
            artifact: az-firewall-watch-linux-arm64
          - os: macos-latest # Apple Silicon / arm64
            artifact: az-firewall-watch-macos
          - os: windows-latest
            artifact: az-firewall-watch

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false   # no token left in .git/config for later steps

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: Build binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --onefile \
            --name az-firewall-watch \
            --collect-all textual \
            --hidden-import azure.eventhub \
            --hidden-import azure.eventhub.aio \
            --hidden-import azure.eventhub._transport._pyamqp_transport \
            --add-data "fw_parser.py:." \
            --add-data "version.txt:." \
            main.py

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: |
          python scripts/version_info.py version_info.txt
          pyinstaller `
            --version-file version_info.txt `
            --onefile `
            --name az-firewall-watch `
            --collect-all textual `
            --hidden-import azure.eventhub `
            --hidden-import azure.eventhub.aio `
            "--hidden-import" "azure.eventhub._transport._pyamqp_transport" `
            "--add-data" "fw_parser.py;." `
            "--add-data" "version.txt;." `
            main.py

      - name: Product version
        id: product
        if: runner.os == 'Windows'
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"

      # Authenticode signing through the SignPath Foundation (free for open source).
      # Tags only, and off until the project is approved: set the repository variable
      # SIGNPATH_ENABLED=true and the secret SIGNPATH_API_TOKEN, then fill in the
      # organization id below. Every signing request needs a manual approval in SignPath.
      - name: Upload unsigned Windows binary
        id: upload-unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          # Outside the az-firewall-watch* pattern the release job downloads
          name: unsigned-windows-exe
          path: dist/az-firewall-watch.exe
          if-no-files-found: error

      - name: Sign Windows binary (SignPath)
        if: runner.os == 'Windows' && vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: az-firewall-watch
          signing-policy-slug: release-signing
          # Pins ProductVersion in the artifact configuration (signpath/artifact-configuration.xml)
          parameters: |
            version: "${{ steps.product.outputs.version }}"
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Room for the manual approval in SignPath (default is 10 minutes)
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: signed

      - name: Replace binary with the signed one
        if: runner.os == 'Windows' && vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Copy-Item signed/az-firewall-watch.exe dist/az-firewall-watch.exe -Force
          $sig = Get-AuthenticodeSignature dist/az-firewall-watch.exe
          if ($sig.Status -ne 'Valid') { throw "Signature check failed: $($sig.Status)" }
          $sig.SignerCertificate.Subject

      - name: Package artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            : # dist/az-firewall-watch.exe is already the correct name
          else
            cd dist && tar -czf "${{ matrix.artifact }}.tar.gz" az-firewall-watch && rm az-firewall-watch
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false   # no token left in .git/config for later steps

      - uses: actions/download-artifact@v4
        with:
          pattern: az-firewall-watch*   # the release binaries, not unsigned-windows-exe
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        # Admins allow-list unsigned binaries by hash (docs/getting-started.md)
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest build provenance
        # Verifiable with: gh attestation verify <file> --repo cloudchristoph/az-firewall-watch
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/az-firewall-watch.exe
            dist/az-firewall-watch-*.tar.gz

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Slice the section between "## [<version>]" and the next "## [" header.
          notes=$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "::warning::No CHANGELOG.md section found for version $version — falling back to auto-generated notes."
            notes="_No manual release notes provided._"
          fi
          {
            echo "notes<<EOF"
            echo "$notes"
            echo ""
            echo "## Install"
            echo ""
            echo "| Platform | Command or file |"
            echo "|----------|-----------------|"
            echo "| Windows | \`winget install cloudchristoph.az-firewall-watch\` or \`az-firewall-watch.exe\` |"
            echo "| macOS Apple Silicon | \`brew install --cask cloudchristoph/tap/az-firewall-watch\` or \`az-firewall-watch-macos.tar.gz\` |"
            echo "| Linux (x86_64) | \`brew install --cask cloudchristoph/tap/az-firewall-watch\` or \`az-firewall-watch-linux.tar.gz\` |"
            echo "| Linux (arm64) | \`brew install --cask cloudchristoph/tap/az-firewall-watch\` or \`az-firewall-watch-linux-arm64.tar.gz\` |"
            echo ""
            echo "SHA-256 of \`az-firewall-watch.exe\`: \`$(sha256sum dist/az-firewall-watch.exe | cut -d' ' -f1)\` (all files: \`SHA256SUMS.txt\`)"
            echo ""
            echo "Code signing policy and privacy: [docs/code-signing.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/code-signing.md). Verify a file's origin with \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
            echo ""
            echo "See [Getting started](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/getting-started.md) for first-run instructions on each platform."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.notes }}

  homebrew:
    # Publish the cask to cloudchristoph/homebrew-tap. Needs the repository
    # secret HOMEBREW_TAP_TOKEN (fine-grained PAT, contents: write on the tap).
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false   # no token left in .git/config for later steps

      - uses: actions/download-artifact@v4
        with:
          pattern: az-firewall-watch-{macos,linux,linux-arm64}
          path: dist
          merge-multiple: true

      - name: Render cask
        run: packaging/homebrew/render-cask.sh "${GITHUB_REF_NAME#v}" dist/az-firewall-watch-macos.tar.gz dist/az-firewall-watch-linux.tar.gz dist/az-firewall-watch-linux-arm64.tar.gz > az-firewall-watch.rb

      - uses: actions/checkout@v6
        with:
          repository: cloudchristoph/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit and push cask
        working-directory: tap
        run: |
          mkdir -p Casks
          cp ../az-firewall-watch.rb Casks/az-firewall-watch.rb
          git add Casks/az-firewall-watch.rb
          if git diff --cached --quiet; then
            echo "Cask unchanged"; exit 0
          fi
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "az-firewall-watch ${GITHUB_REF_NAME}"
          git push

  dryrun:
    # Everything the release and homebrew jobs would publish, as artifacts only.
    needs: build
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false   # no token left in .git/config for later steps

      - uses: actions/download-artifact@v4
        with:
          pattern: az-firewall-watch*
          path: dist
          merge-multiple: true

      - name: Checksums, cask and winget manifests
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          packaging/homebrew/render-cask.sh "$version" dist/az-firewall-watch-macos.tar.gz dist/az-firewall-watch-linux.tar.gz dist/az-firewall-watch-linux-arm64.tar.gz > dist/az-firewall-watch.rb
          packaging/winget/render-manifests.sh "$version" dist/az-firewall-watch.exe dist/winget

      - uses: actions/upload-artifact@v4
        with:
          name: dryrun-packages
          path: |
            dist/SHA256SUMS.txt
            dist/az-firewall-watch.rb
            dist/winget/
          if-no-files-found: error
