name: Tests

on:
  push:
    branches: [main] # feature branches are covered by their pull request
    paths-ignore: ["**.md", "docs/**"] # docs-only changes need no test run
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock.txt
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock.txt

      - name: Run tests
        run: pytest
