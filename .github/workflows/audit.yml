name: Dependency audit

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 07:00 CET (08:00 CEST in summer), catches advisories published since the last release
  pull_request:
    paths:
      - "requirements*.txt"
      - "requirements*.in"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    # The lock has platform and Python markers that pip-audit evaluates against the
    # running interpreter, so each release OS (and 3.10 for the older pins) audits its own set
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pip-audit
        run: pip install --require-hashes -r requirements-audit.lock.txt
      # Audits the hashed release lock (runtime plus build) as pinned, without resolving,
      # so pip-audit and bootstrap packages of this runner are not part of the audit
      - name: pip-audit
        run: pip-audit --disable-pip -r requirements-build.lock.txt
